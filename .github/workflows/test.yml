name: Tests

on:
  push:
    branches: [main, renoise/3.5.4]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua 5.1 (matches Renoise's LuaJIT)
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Compile-check all sources
        run: |
          set -e
          for f in main.lua lib/*.lua tests/run.lua; do
            echo "checking $f"
            lua -e "assert(loadfile('$f'))"
          done

  test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua 5.1 (matches Renoise's LuaJIT)
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install dev dependencies from rockspec
        run: luarocks install --deps-only ./pluginupdater-dev-0.0.1-1.rockspec

      - name: Run test suite with coverage
        run: lua -lluacov tests/run.lua

      - name: Generate lcov coverage report
        run: luacov -r lcov

      - name: Make coverage paths repo-relative
        # luacov records absolute SF: paths; Codecov can't map them back to the
        # repo, so it attributes ~0 lines and the badge collapses. Strip the CI
        # workspace prefix so the report references lib/up_*.lua, main.lua, etc.
        run: lua -e 'local p="coverage.lcov";local f=io.open(p);local s=f:read("*a");f:close();s=s:gsub("SF:"..os.getenv("PWD").."/","SF:");f=io.open(p,"w");f:write(s);f:close()'

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
