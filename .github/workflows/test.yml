name: Tests

on:
  push:
    branches: [main, renoise/3.5.4]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua 5.1 (matches Renoise's LuaJIT)
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Compile-check all sources
        run: |
          set -e
          for f in main.lua lib/*.lua tests/run.lua; do
            echo "checking $f"
            lua -e "assert(loadfile('$f'))"
          done

  test:
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Lua 5.1 (matches Renoise's LuaJIT)
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install dev dependencies from rockspec
        run: luarocks install --deps-only ./plup-dev-0.0.1-1.rockspec

      - name: Run test suite with coverage
        run: lua -lluacov tests/run.lua

      - name: Generate lcov coverage report
        run: luacov -r lcov

      - name: Filter coverage report to product sources
        # luacov records absolute SF: paths and (in some builds) may leave the
        # vendored LibDeflate.lua / slaxml.lua in the report at 0%, dragging the
        # percentage down. Rewrite the report so it only ever contains the
        # product sources (lib/up_*.lua, main.lua) with repo-relative paths that
        # Codecov can map. `$PWD` is used as a Lua *pattern*, so escape its
        # metacharacters (e.g. the dots in `org.bitbear...`) and skip the rewrite
        # when it's absent.
        run: |
          lua -e '
            local p = "coverage.lcov"
            local f = io.open(p)
            if not f then os.exit(0) end
            local s = f:read("*a")
            f:close()
            local pwd = os.getenv("PWD")
            if pwd and pwd ~= "" then
              local esc = pwd:gsub("[%(%)%.%%%+%-%*%?%[%]%^%$]", "%%%0")
              s = s:gsub("SF:" .. esc .. "/", "SF:")
            end
            local out = {}
            for block in s:gmatch("SF:.-end_of_record\n?") do
              local sf = block:match("SF:([^\n]*)")
              if sf and (sf:match("^lib/up_") or sf == "main.lua") then
                out[#out + 1] = block
              end
            end
            f = io.open(p, "w")
            f:write(table.concat(out))
            f:close()
          '

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage.lcov

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-lcov
          path: .

      - name: Upload coverage to Codecov
        # On fork PRs GitHub does not provide repo secrets, so the token is
        # empty; skip the upload there rather than failing CI. When the token
        # is present (first-party runs) we fail the job on upload errors to
        # keep CI signal.
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
